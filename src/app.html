<!doctype html>
<!-- en-GB, not en: the content is British throughout, and the language tag is what
     picks the hyphenation dictionary for `hyphens: auto`. -->
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#167E3C" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121B14" />
		<meta name="apple-mobile-web-app-title" content="Tree Hunt" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="preload" href="%sveltekit.assets%/fonts/inter-tight-var.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/libre-caslon-text-400.woff2" as="font" type="font/woff2" crossorigin />
		<!-- The italic earns a preload because it is not decorative: every Latin
		     binomial in the app is set in it, on Today, the deck, Learn and every
		     species page. Without this it arrives a beat late and the binomials
		     visibly reflow. -->
		<link rel="preload" href="%sveltekit.assets%/fonts/libre-caslon-text-400-italic.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- Catch `beforeinstallprompt` before the app exists.
		     Chrome fires it as soon as it decides the page is installable, which can
		     be before SvelteKit has hydrated and attached its own listener. Miss it
		     and there is no way to ask for it again: the event is not replayed, so
		     Android quietly falls back to "open the three-dot menu" instructions
		     when a one-tap system install was available the whole time. Stash it
		     here and let the store adopt it on init. -->
		<script>
			window.__installEvent = null;
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__installEvent = e;
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
